<!DOCTYPE html>
<html>

<head>
    <title>Socket Test</title>
</head>

<body>

<h2>Waiting for Low Stock Alert...</h2>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<script>

const socket = io("http://localhost:5000");

socket.on("connect", () => {
    console.log("Connected");
});

socket.on("lowStock", (data) => {
    alert(data.message);
    console.log(data);
});

</script>

</body>

</html>
